<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Dark Yin Gradient -->
    <linearGradient id="darkYin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle with border -->
  <circle cx="256" cy="256" r="246" fill="url(#bgGrad)" stroke="url(#goldRing)" stroke-width="10" />

  <!-- 8-Pointed Star (Tia sáng Bát Quái / Tử Vi Đẩu Số) -->
  <g filter="url(#goldGlow)" opacity="0.95">
    <!-- 0 deg (Top) -->
    <polygon points="256,26 270,126 256,116 242,126" fill="url(#goldGrad)" />
    <!-- 180 deg (Bottom) -->
    <polygon points="256,486 270,386 256,396 242,386" fill="url(#goldGrad)" />
    <!-- 90 deg (Right) -->
    <polygon points="486,256 386,270 396,256 386,242" fill="url(#goldGrad)" />
    <!-- 270 deg (Left) -->
    <polygon points="26,256 126,270 116,256 126,242" fill="url(#goldGrad)" />
    <!-- 45 deg (Top-Right) -->
    <polygon points="418,94 344,174 354,162 366,172" fill="url(#goldGrad)" />
    <!-- 135 deg (Bottom-Right) -->
    <polygon points="418,418 366,340 354,350 344,338" fill="url(#goldGrad)" />
    <!-- 225 deg (Bottom-Left) -->
    <polygon points="94,418 168,338 158,350 146,340" fill="url(#goldGrad)" />
    <!-- 315 deg (Top-Left) -->
    <polygon points="94,94 146,172 158,162 168,174" fill="url(#goldGrad)" />
  </g>

  <!-- Inner Golden Ring -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="url(#goldRing)" stroke-width="3.5" opacity="0.75" stroke-dasharray="8 6" />

  <!-- Thái Cực (Taijitu - Âm Dương) Central Circle (Radius = 126) -->
  <g transform="rotate(-30 256 256)">
    <!-- Base circle (Dark Yin) -->
    <circle cx="256" cy="256" r="126" fill="url(#darkYin)" stroke="url(#goldRing)" stroke-width="5" />

    <!-- Yang half (Gold) -->
    <path d="M 256 130
             A 126 126 0 0 1 256 382
             A 63 63 0 0 1 256 256
             A 63 63 0 0 0 256 130 Z"
          fill="url(#goldGrad)" />

    <!-- Dots -->
    <!-- Yin dot inside Yang -->
    <circle cx="256" cy="193" r="20" fill="url(#darkYin)" stroke="url(#goldRing)" stroke-width="2.5" />

    <!-- Yang dot inside Yin -->
    <circle cx="256" cy="319" r="20" fill="url(#goldGrad)" stroke="url(#goldRing)" stroke-width="2.5" />
  </g>

  <!-- Outer Ring Accent Dots at 12 Zodiac positions -->
  <g fill="url(#goldGrad)">
    <circle cx="256" cy="56" r="4.5" />
    <circle cx="356" cy="83" r="4.5" />
    <circle cx="429" cy="156" r="4.5" />
    <circle cx="456" cy="256" r="4.5" />
    <circle cx="429" cy="356" r="4.5" />
    <circle cx="356" cy="429" r="4.5" />
    <circle cx="256" cy="456" r="4.5" />
    <circle cx="156" cy="429" r="4.5" />
    <circle cx="83" cy="356" r="4.5" />
    <circle cx="56" cy="256" r="4.5" />
    <circle cx="83" cy="156" r="4.5" />
    <circle cx="156" cy="83" r="4.5" />
  </g>
</svg>